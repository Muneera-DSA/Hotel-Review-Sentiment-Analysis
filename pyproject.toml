[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-sentiment"
version = "2.0.0"
description = "Review-level sentiment classification on 515K European hotel reviews (TF-IDF + logistic regression, hotel-grouped evaluation)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muneera Mohamed" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "shap>=0.46", "pytest-github-actions-annotate-failures>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
